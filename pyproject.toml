[project]
name = "deficoser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "numpy>=2.0",
    "requests>=2.34.2",
    "langgraph>=0.4",
    "openai>=1.60",
    "slither-analyzer>=0.11.5",
    "networkx>=3.0",
    "py-solc-x>=2.0",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deficoser"]
